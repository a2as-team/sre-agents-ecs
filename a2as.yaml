manifest:
  version: "0.1.3"
  schema: https://a2as.org/cert/schema
  subject:
    name: sre-agents/sre-agents-ecs
    source: https://github.com/sre-agents/sre-agents-ecs
    branch: main
    commit: "fc4c02c4"
    scope: [src/agent.py, src/sampling/sampler.py, src/memory/short_term_memory.py, src/prompts/long_term_memory_prompt.py,
      src/prompts/knowledgebase_prompt.py, src/prompts/agent_calling_prompt.py, src/utils/logger.py, src/config.py, src/tools/call_agent.py]
  issued:
    by: A2AS.org
    at: '2026-02-11T16:40:34Z'
    url: https://a2as.org/certified/agents/sre-agents/sre-agents-ecs
  signatures:
    digest: sha256:e4y7WLjHQYsdfoXzT2A4CnLzsgrQdeQaoOGbOqWmj7Y
    key: ed25519:-ViYzpjnmN5MkwbMLFKwQeNlePh3G4tID9jJovcxzII
    sig: ed25519:SFs9xqgSXx2xQUblCC6rwJYC6xwyt5cawEeYo2miM5IYYyWDtVltsmZ1VK5MAKvPmBcC5NrEov1OI0tK2StiAg

agents:
  agent.Agent.agent:
    type: class
    models: [self.model]
    tools: [self.tools]
    mcp: [MCPToolset]
    params:
      name: self.name
      description: self.description
      instruction: self.system_prompt
      class: Agent

models:
  self.model:
    type: literal
    agents: [agent.Agent.agent]

tools:
  self.tools:
    type: mcp
    agents: [agent.Agent.agent]
    mcp: [MCPToolset]
    params:
      dynamic: "True"
      mcp_source: MCPToolset

mcp:
  MCPToolset:
    type: network
    url: mcp_server
    agents: [agent.Agent.agent]
    params:
      class: Agent
      connection_type: SseServerParams
      function: __init__

imports:
  AGENT_CALLING_PROMPT: src.prompts.agent_calling_prompt.AGENT_CALLING_PROMPT
  asyncio: asyncio
  BaseModel: pydantic.BaseModel
  BaseSettings: pydantic_settings.BaseSettings
  call_agent: src.tools.call_agent.call_agent
  call_agent_module: src.tools.call_agent
  datetime: datetime.datetime
  get_logger: src.utils.logger.get_logger
  InMemorySessionService: google.adk.sessions.InMemorySessionService
  InsecureRequestWarning: urllib3.exceptions.InsecureRequestWarning
  json: json
  KNOWLEDGEBASE_DOC_TEMPLATE: src.prompts.knowledgebase_prompt.KNOWLEDGEBASE_DOC_TEMPLATE
  KNOWLEDGEBASE_PROMPT: src.prompts.knowledgebase_prompt.KNOWLEDGEBASE_PROMPT
  LiteLlm: google.adk.models.lite_llm.LiteLlm
  LlmAgent: google.adk.agents.LlmAgent
  logger: loguru.logger
  logging: logging
  LONG_TERM_MEMORY_PROMPT: src.prompts.long_term_memory_prompt.LONG_TERM_MEMORY_PROMPT
  MCPToolset: google.adk.tools.mcp_tool.mcp_toolset.MCPToolset
  os: os
  Runner: google.adk.runners.Runner
  Sampler: src.sampling.sampler.Sampler
  settings: src.config.settings
  ShortTermMemory: src.memory.short_term_memory.ShortTermMemory
  SINGLE_MEMORY_TEMPLATE: src.prompts.long_term_memory_prompt.SINGLE_MEMORY_TEMPLATE
  SseServerParams: google.adk.tools.mcp_tool.mcp_toolset.SseServerParams
  SUB_AGENT_INFO_TEMPLATE: src.prompts.agent_calling_prompt.SUB_AGENT_INFO_TEMPLATE
  sys: sys
  types: google.genai.types
  warnings: warnings

functions:
  __init__:
    type: sync
    module: src.memory.short_term_memory
    args: [self, name]
  _add_sub_agents:
    type: sync
    module: src.agent
    args: [self, sub_agents]
    params:
      returns: None
  _build_knowledgebase_rag_prompt:
    type: sync
    module: src.agent
    args: [self, prompt, documents]
  _build_longterm_memory_rag_prompt:
    type: sync
    module: src.agent
    args: [self, prompt, documents]
  _dump_path:
    type: sync
    module: src.sampling.sampler
    args: [self]
  _post_run:
    type: async
    module: src.agent
    args: [self, prompt, event]
  _pre_run:
    type: sync
    module: src.agent
    args: [self, prompt]
  _process_schemas:
    type: sync
    module: src.agent
    args: [self]
  _run:
    type: async
    module: src.agent
    args: [self, prompt]
  add_sample:
    type: sync
    module: src.sampling.sampler
    args: [self, input, output]
  call_agent:
    type: async
    module: src.tools.call_agent
    args: [agent_name, prompt]
  create:
    type: async
    module: src.memory.short_term_memory
    args: [cls, name]
  create_reasoning_model:
    type: sync
    module: src.agent
    args: [model_provider, model, api_key, api_base]
  filter_log:
    type: sync
    module: src.utils.logger
  get_logger:
    type: sync
    module: src.utils.logger
    args: [name]
  get_time:
    type: sync
    module: src.sampling.sampler
  is_json:
    type: sync
    module: src.sampling.sampler
    args: [string]
  run:
    type: async
    module: src.agent
    args: [self, prompt]
    params:
      returns: str
  setup_logger:
    type: sync
    module: src.utils.logger

files:
  dir_path:
    type: variable
    actions: [read]
    params:
      caller: [os.makedirs]
